<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesktopDashboards - 管理画面</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #12151b;
      color: #eef2f6;
      line-height: 1.45;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .panel {
      background: #1b2029;
      border: 1px solid #2c3442;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label.field-label {
      font-size: 11px;
      color: #94a3b8;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #384252;
      background: #0f1217;
      color: #f8fafc;
      font-size: 13px;
    }
    .bounds-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .bounds-field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .bounds-field input[type="number"] {
      width: 68px;
      padding: 4px 6px;
      font-size: 12px;
    }
    .settings-grid {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid #222936;
      font-size: 12px;
      color: #cbd5e1;
    }
    .slider-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .slider-field input[type="range"] {
      width: 90px;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .slider-field select {
      width: auto;
      padding: 3px 6px;
      font-size: 11px;
    }
    details.css-details {
      border-top: 1px solid #222936;
      padding-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    details.css-details summary {
      cursor: pointer;
      user-select: none;
    }
    .css-editor-wrap {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .css-editor-wrap textarea {
      width: 100%;
      min-height: 68px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #384252;
      background: #0f1217;
      color: #e2e8f0;
      font-family: Consolas, "Cascadia Code", monospace;
      font-size: 11px;
      resize: vertical;
    }
    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    button.primary {
      background: #2563eb;
      color: #fff;
    }
    button.secondary {
      background: #334155;
      color: #e2e8f0;
    }
    button.danger {
      background: #991b1b;
      color: #fee2e2;
    }
    .widget-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .widget-card {
      background: #141820;
      border: 1px solid #2b3341;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .widget-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .widget-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      background: #1e293b;
      color: #93c5fd;
    }
    .badge.file {
      background: #1e293b;
      color: #6ee7b7;
    }
    .widget-title {
      font-weight: 600;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .widget-source {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
    }
    .widget-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .widget-coords {
      font-size: 11px;
      color: #64748b;
    }
    .widget-actions {
      display: flex;
      gap: 6px;
    }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #cbd5e1;
      user-select: none;
    }
    .switch input {
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #34d399;
      min-height: 18px;
      margin-top: 6px;
    }
    #status.error {
      color: #f87171;
    }
    .empty {
      color: #64748b;
      font-size: 13px;
      padding: 12px 0;
      text-align: center;
    }
    .meta {
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <h1>DesktopDashboards</h1>
    <button class="secondary" id="btn-reload-all">すべて再読み込み</button>
  </header>

  <section class="panel">
    <h2>新規ガジェット追加</h2>
    <div class="row">
      <div class="field" style="flex: 0 0 130px;">
        <label class="field-label" for="source-type">種別</label>
        <select id="source-type">
          <option value="url">Web URL</option>
          <option value="file">ローカル HTML</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="widget-title">タイトル（任意）</label>
        <input id="widget-title" type="text" placeholder="例: 通勤電車 時刻表" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label class="field-label" for="widget-source">URL または HTML ファイルパス</label>
        <input id="widget-source" type="text" placeholder="https://muse.ai/..." />
      </div>
      <button class="secondary" id="btn-browse" style="margin-top: 18px; display: none;">参照...</button>
      <button class="primary" id="btn-add" style="margin-top: 18px;">追加して表示</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="panel">
    <h2>登録済みガジェット一覧</h2>
    <div id="widget-list" class="widget-list"></div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content: space-between;">
      <label class="switch">
        <input type="checkbox" id="chk-autostart" />
        Windows 起動時に自動起動（<code>--silent</code> でトレイ常駐）
      </label>
    </div>
    <div class="meta" style="margin-top: 8px;">
      WebView2 プロファイル: <span id="data-dir">読み込み中...</span>
    </div>
  </section>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const listen = window.__TAURI__.event.listen;
    const dialogOpen = window.__TAURI__.dialog?.open;

    const sourceTypeEl = document.getElementById("source-type");
    const titleEl = document.getElementById("widget-title");
    const sourceEl = document.getElementById("widget-source");
    const browseBtn = document.getElementById("btn-browse");
    const addBtn = document.getElementById("btn-add");
    const reloadAllBtn = document.getElementById("btn-reload-all");
    const widgetListEl = document.getElementById("widget-list");
    const autostartChk = document.getElementById("chk-autostart");
    const statusEl = document.getElementById("status");
    const dataDirEl = document.getElementById("data-dir");
    let samplesDirPath = null;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    sourceTypeEl.addEventListener("change", () => {
      const isFile = sourceTypeEl.value === "file";
      browseBtn.style.display = isFile ? "inline-block" : "none";
      sourceEl.placeholder = isFile
        ? "C:\\path\\to\\widget.html"
        : "https://muse.ai/...";
    });

    browseBtn.addEventListener("click", async () => {
      if (!dialogOpen) {
        setStatus("ファイル選択ダイアログが利用できません。", true);
        return;
      }
      try {
        if (!samplesDirPath) {
          const dir = await invoke("get_samples_dir").catch(() => null);
          if (typeof dir === "string" && dir) {
            samplesDirPath = dir;
          }
        }
        const dialogOptions = {
          multiple: false,
          filters: [{ name: "HTML ファイル", extensions: ["html", "htm"] }],
        };
        if (samplesDirPath) {
          dialogOptions.defaultPath = samplesDirPath;
        }
        const selected = await dialogOpen(dialogOptions);
        if (typeof selected === "string" && selected) {
          sourceEl.value = selected;
        }
      } catch (err) {
        setStatus(`ファイル選択エラー: ${err}`, true);
      }
    });

    addBtn.addEventListener("click", async () => {
      const sourceType = sourceTypeEl.value;
      const source = sourceEl.value.trim();
      const title = titleEl.value.trim();
      if (!source) {
        setStatus("URL またはファイルパスを入力してください。", true);
        return;
      }
      try {
        await invoke("add_widget", { sourceType, source, title });
        sourceEl.value = "";
        titleEl.value = "";
        setStatus("ガジェットを追加しました。");
        await refreshAll();
      } catch (err) {
        setStatus(`追加エラー: ${err}`, true);
      }
    });

    reloadAllBtn.addEventListener("click", async () => {
      await invoke("reload_all_widgets");
      setStatus("表示中のガジェットを再読み込みしました。");
    });

    autostartChk.addEventListener("change", async () => {
      try {
        await invoke("set_autostart", { enabled: autostartChk.checked });
        setStatus(
          autostartChk.checked
            ? "Windows 起動時の自動起動を有効にしました。"
            : "Windows 起動時の自動起動を無効にしました。"
        );
      } catch (err) {
        setStatus(`自動起動設定エラー: ${err}`, true);
        await refreshAutostart();
      }
    });

    async function refreshWidgets() {
      const widgets = await invoke("list_widgets");
      widgetListEl.innerHTML = "";
      if (!widgets.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "ガジェットはまだ登録されていません。";
        widgetListEl.appendChild(empty);
        return;
      }

      for (const w of widgets) {
        const card = document.createElement("div");
        card.className = "widget-card";

        const top = document.createElement("div");
        top.className = "widget-top";

        const titleWrap = document.createElement("div");
        titleWrap.className = "widget-title-wrap";

        const badge = document.createElement("span");
        badge.className = `badge ${w.source_type === "file" ? "file" : ""}`;
        badge.textContent = w.source_type === "file" ? "HTML" : "URL";

        const titleSpan = document.createElement("span");
        titleSpan.className = "widget-title";
        titleSpan.textContent = w.title;

        titleWrap.appendChild(badge);
        titleWrap.appendChild(titleSpan);

        const toggleLabel = document.createElement("label");
        toggleLabel.className = "switch";
        const toggleChk = document.createElement("input");
        toggleChk.type = "checkbox";
        toggleChk.checked = w.enabled;
        toggleChk.addEventListener("change", async () => {
          try {
            await invoke("toggle_widget", { id: w.id, enabled: toggleChk.checked });
          } catch (err) {
            setStatus(`切替エラー: ${err}`, true);
            await refreshWidgets();
          }
        });
        toggleLabel.appendChild(toggleChk);
        toggleLabel.appendChild(document.createTextNode("表示"));

        top.appendChild(titleWrap);
        top.appendChild(toggleLabel);

        const srcDiv = document.createElement("div");
        srcDiv.className = "widget-source";
        srcDiv.textContent = w.source;

        const bottom = document.createElement("div");
        bottom.className = "widget-bottom";

        const boundsRow = document.createElement("div");
        boundsRow.className = "bounds-row";

        const mkNumInput = (labelText, value, minVal) => {
          const wrap = document.createElement("label");
          wrap.className = "bounds-field";
          wrap.textContent = labelText;
          const inp = document.createElement("input");
          inp.type = "number";
          inp.value = String(value);
          if (minVal !== undefined) inp.min = String(minVal);
          wrap.appendChild(inp);
          return { wrap, inp };
        };

        const xField = mkNumInput("X", w.x);
        const yField = mkNumInput("Y", w.y);
        const wField = mkNumInput("幅", w.width, 120);
        const hField = mkNumInput("高", w.height, 80);

        const btnApply = document.createElement("button");
        btnApply.className = "secondary";
        btnApply.textContent = "適用";
        btnApply.addEventListener("click", async () => {
          const x = parseInt(xField.inp.value, 10) || 0;
          const y = parseInt(yField.inp.value, 10) || 0;
          const width = Math.max(120, parseInt(wField.inp.value, 10) || w.width);
          const height = Math.max(80, parseInt(hField.inp.value, 10) || w.height);
          try {
            await invoke("update_widget_bounds", { id: w.id, x, y, width, height });
            setStatus(`「${w.title}」の位置・サイズを更新しました。`);
          } catch (err) {
            setStatus(`更新エラー: ${err}`, true);
          }
        });

        boundsRow.appendChild(xField.wrap);
        boundsRow.appendChild(yField.wrap);
        boundsRow.appendChild(wField.wrap);
        boundsRow.appendChild(hField.wrap);
        boundsRow.appendChild(btnApply);

        const actions = document.createElement("div");
        actions.className = "widget-actions";

        const btnReload = document.createElement("button");
        btnReload.className = "secondary";
        btnReload.textContent = "再読込";
        btnReload.addEventListener("click", () => invoke("reload_widget", { id: w.id }));

        const btnReset = document.createElement("button");
        btnReset.className = "secondary";
        btnReset.textContent = "中央へ戻す";
        btnReset.addEventListener("click", async () => {
          await invoke("reset_widget_position", { id: w.id });
          setStatus(`「${w.title}」の位置を中央へ戻しました。`);
          await refreshWidgets();
        });

        const btnDelete = document.createElement("button");
        btnDelete.className = "danger";
        btnDelete.textContent = "削除";
        btnDelete.addEventListener("click", async () => {
          await invoke("delete_widget", { id: w.id });
          setStatus(`「${w.title}」を削除しました。`);
          await refreshWidgets();
        });

        actions.appendChild(btnReload);
        actions.appendChild(btnReset);
        actions.appendChild(btnDelete);

        bottom.appendChild(boundsRow);
        bottom.appendChild(actions);

        // Phase 2 設定行（ロック・クリック透過・NOACTIVATE・透明度・ズーム・自動リロード）
        const settingsGrid = document.createElement("div");
        settingsGrid.className = "settings-grid";

        const stateDraft = {
          placementMode: w.placement_mode || "bottom",
          locked: !!w.locked,
          clickThrough: !!w.click_through,
          noActivate: !!w.no_activate,
          opacity: typeof w.opacity === "number" ? w.opacity : 1.0,
          zoom: typeof w.zoom === "number" ? w.zoom : 1.0,
          autoReloadMinutes: typeof w.auto_reload_minutes === "number" ? w.auto_reload_minutes : 0,
          customCss: typeof w.custom_css === "string" ? w.custom_css : "",
        };

        const saveSettings = async () => {
          try {
            await invoke("update_widget_settings", {
              id: w.id,
              placementMode: stateDraft.placementMode,
              locked: stateDraft.locked,
              clickThrough: stateDraft.clickThrough,
              noActivate: stateDraft.noActivate,
              opacity: stateDraft.opacity,
              zoom: stateDraft.zoom,
              autoReloadMinutes: stateDraft.autoReloadMinutes,
              customCss: stateDraft.customCss,
            });
          } catch (err) {
            setStatus(`設定更新エラー: ${err}`, true);
          }
        };

        const mkFlag = (labelText, initial, onChange) => {
          const lbl = document.createElement("label");
          lbl.className = "switch";
          lbl.style.fontSize = "11px";
          const chk = document.createElement("input");
          chk.type = "checkbox";
          chk.checked = initial;
          chk.addEventListener("change", () => {
            onChange(chk.checked);
            saveSettings();
          });
          lbl.appendChild(chk);
          lbl.appendChild(document.createTextNode(labelText));
          return lbl;
        };

        settingsGrid.appendChild(mkFlag("ロック", stateDraft.locked, (v) => { stateDraft.locked = v; }));
        settingsGrid.appendChild(mkFlag("クリック透過", stateDraft.clickThrough, (v) => { stateDraft.clickThrough = v; }));
        settingsGrid.appendChild(mkFlag("フォーカス非奪取", stateDraft.noActivate, (v) => { stateDraft.noActivate = v; }));

        const opWrap = document.createElement("label");
        opWrap.className = "slider-field";
        const opValSpan = document.createElement("span");
        opValSpan.textContent = `${Math.round(stateDraft.opacity * 100)}%`;
        const opInput = document.createElement("input");
        opInput.type = "range";
        opInput.min = "20";
        opInput.max = "100";
        opInput.step = "5";
        opInput.value = String(Math.round(stateDraft.opacity * 100));
        opInput.addEventListener("input", () => {
          opValSpan.textContent = `${opInput.value}%`;
        });
        opInput.addEventListener("change", () => {
          stateDraft.opacity = Number(opInput.value) / 100;
          saveSettings();
        });
        opWrap.appendChild(document.createTextNode("透明度"));
        opWrap.appendChild(opInput);
        opWrap.appendChild(opValSpan);
        settingsGrid.appendChild(opWrap);

        const zoomWrap = document.createElement("label");
        zoomWrap.className = "slider-field";
        const zoomValSpan = document.createElement("span");
        zoomValSpan.textContent = `${Math.round(stateDraft.zoom * 100)}%`;
        const zoomInput = document.createElement("input");
        zoomInput.type = "range";
        zoomInput.min = "50";
        zoomInput.max = "200";
        zoomInput.step = "10";
        zoomInput.value = String(Math.round(stateDraft.zoom * 100));
        zoomInput.addEventListener("input", () => {
          zoomValSpan.textContent = `${zoomInput.value}%`;
        });
        zoomInput.addEventListener("change", () => {
          stateDraft.zoom = Number(zoomInput.value) / 100;
          saveSettings();
        });
        zoomWrap.appendChild(document.createTextNode("ズーム"));
        zoomWrap.appendChild(zoomInput);
        zoomWrap.appendChild(zoomValSpan);
        settingsGrid.appendChild(zoomWrap);

        const reloadWrap = document.createElement("label");
        reloadWrap.className = "slider-field";
        const reloadSel = document.createElement("select");
        for (const mins of [0, 1, 5, 15, 30, 60]) {
          const opt = document.createElement("option");
          opt.value = String(mins);
          opt.textContent = mins === 0 ? "無効" : `${mins}分`;
          if (mins === stateDraft.autoReloadMinutes) opt.selected = true;
          reloadSel.appendChild(opt);
        }
        reloadSel.addEventListener("change", () => {
          stateDraft.autoReloadMinutes = parseInt(reloadSel.value, 10) || 0;
          saveSettings();
        });
        reloadWrap.appendChild(document.createTextNode("自動更新"));
        reloadWrap.appendChild(reloadSel);
        settingsGrid.appendChild(reloadWrap);

        const modeWrap = document.createElement("label");
        modeWrap.className = "slider-field";
        const modeSel = document.createElement("select");
        for (const [val, label] of [
          ["bottom", "モードA: 最背面固定"],
          ["worker_w", "モードB: 壁紙埋め込み (WorkerW)"],
        ]) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = label;
          if (val === stateDraft.placementMode) opt.selected = true;
          modeSel.appendChild(opt);
        }
        modeSel.addEventListener("change", () => {
          stateDraft.placementMode = modeSel.value;
          saveSettings();
        });
        modeWrap.appendChild(document.createTextNode("配置"));
        modeWrap.appendChild(modeSel);
        settingsGrid.appendChild(modeWrap);

        const cssDetails = document.createElement("details");
        cssDetails.className = "css-details";
        const cssSummary = document.createElement("summary");
        cssSummary.textContent = stateDraft.customCss.trim()
          ? "カスタム CSS（設定あり）"
          : "カスタム CSS";
        const cssWrap = document.createElement("div");
        cssWrap.className = "css-editor-wrap";
        const cssArea = document.createElement("textarea");
        cssArea.placeholder = "例: body { background: transparent !important; }";
        cssArea.value = stateDraft.customCss;
        const cssActions = document.createElement("div");
        cssActions.style.display = "flex";
        cssActions.style.justifyContent = "flex-end";
        const btnCssApply = document.createElement("button");
        btnCssApply.className = "secondary";
        btnCssApply.textContent = "CSS 適用";
        btnCssApply.addEventListener("click", async () => {
          stateDraft.customCss = cssArea.value;
          await saveSettings();
          setStatus(`「${w.title}」にカスタム CSS を適用しました。`);
        });
        cssActions.appendChild(btnCssApply);
        cssWrap.appendChild(cssArea);
        cssWrap.appendChild(cssActions);
        cssDetails.appendChild(cssSummary);
        cssDetails.appendChild(cssWrap);

        card.appendChild(top);
        card.appendChild(srcDiv);
        card.appendChild(bottom);
        card.appendChild(settingsGrid);
        card.appendChild(cssDetails);
        widgetListEl.appendChild(card);
      }
    }

    async function refreshAutostart() {
      try {
        autostartChk.checked = await invoke("get_autostart");
      } catch (_) {}
    }

    async function refreshAll() {
      await Promise.all([refreshWidgets(), refreshAutostart()]);
    }

    listen("widgets-updated", () => {
      refreshAll();
    });

    invoke("get_webview_data_dir")
      .then((dir) => {
        dataDirEl.textContent = dir;
      })
      .catch((err) => {
        dataDirEl.textContent = `取得失敗: ${err}`;
      });

    invoke("get_samples_dir")
      .then((dir) => {
        if (typeof dir === "string" && dir) {
          samplesDirPath = dir;
        }
      })
      .catch(() => {});

    refreshAll();
  </script>
</body>
</html>
